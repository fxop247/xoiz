<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xoiz Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #05130b;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .neon-card {
      background: linear-gradient(145deg, #0d2516, #06170d);
      border: 1px solid rgba(34, 197, 94, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .neon-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .active-nav {
      color: #10b981;
    }
  </style>
</head>
<body class="pb-24">

  <!-- Header -->
  <div class="px-5 pt-5 pb-3 flex justify-between items-center border-b border-emerald-950/60">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center font-bold text-emerald-400" id="userAvatar">
        X
      </div>
      <div>
        <p class="text-xs text-emerald-500 font-medium tracking-wide">WELCOME BACK</p>
        <p class="font-bold text-white text-sm" id="username">Guest User</p>
      </div>
    </div>
    <div class="bg-emerald-950/80 px-3 py-1.5 rounded-full border border-emerald-800 text-xs font-semibold text-emerald-300">
      ⚡ ID: <span id="userId">---</span>
    </div>
  </div>

  <!-- Balance Card -->
  <div class="p-5">
    <div class="neon-card rounded-2xl p-5 relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-emerald-500/10 rounded-full blur-2xl"></div>
      <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Total Balance</p>
      <div class="flex items-baseline space-x-2 mt-1">
        <h1 class="text-4xl font-extrabold text-white" id="balance">0</h1>
        <span class="text-emerald-400 font-bold text-sm tracking-wide">XOIZ</span>
      </div>
      <p class="text-xs text-emerald-400/80 mt-1 font-medium">≈ $<span id="usdVal">0.0000</span></p>
      
      <div class="grid grid-cols-2 gap-3 mt-4">
        <button onclick="switchTab('earn')" class="neon-btn py-2.5 rounded-xl font-bold text-sm text-black flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-bolt"></i>
          <span>EARN</span>
        </button>
        <button onclick="switchTab('wallet')" class="bg-emerald-950 border border-emerald-700/60 py-2.5 rounded-xl font-bold text-sm text-emerald-300 flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-wallet"></i>
          <span>WITHDRAW</span>
        </button>
      </div>
    </div>
  </div>

  <!-- TAB: HOME / TASKS -->
  <div id="tab-home" class="tab-content px-5 space-y-4">
    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Quick Actions</p>
    
    <div class="neon-card rounded-xl p-4 flex items-center justify-between cursor-pointer" onclick="watchAd()">
      <div class="flex items-center space-x-3">
        <div class="w-11 h-11 rounded-lg bg-emerald-950 flex items-center justify-center text-emerald-400 text-lg border border-emerald-800">
          <i class="fa-solid fa-play"></i>
        </div>
        <div>
          <h4 class="font-bold text-sm text-white">Watch Sponsored Ad</h4>
          <p class="text-xs text-gray-400">+100 XOIZ Coins</p>
        </div>
      </div>
      <button class="bg-emerald-600/30 text-emerald-400 text-xs font-bold px-3 py-1.5 rounded-lg border border-emerald-500/40">
        WATCH
      </button>
    </div>

    <div class="neon-card rounded-xl p-4 flex items-center justify-between cursor-pointer" onclick="openChannel()">
      <div class="flex items-center space-x-3">
        <div class="w-11 h-11 rounded-lg bg-emerald-950 flex items-center justify-center text-emerald-400 text-lg border border-emerald-800">
          <i class="fa-brands fa-telegram"></i>
        </div>
        <div>
          <h4 class="font-bold text-sm text-white">Join Official Channel</h4>
          <p class="text-xs text-gray-400">+250 XOIZ Coins</p>
        </div>
      </div>
      <button class="bg-emerald-600/30 text-emerald-400 text-xs font-bold px-3 py-1.5 rounded-lg border border-emerald-500/40">
        JOIN
      </button>
    </div>
  </div>

  <!-- TAB: EARN (ADS) -->
  <div id="tab-earn" class="tab-content hidden px-5 space-y-4">
    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Ad Tasks</p>
    <div class="grid grid-cols-2 gap-3">
      <div class="neon-card p-4 rounded-xl text-center space-y-2">
        <div class="text-2xl text-emerald-400"><i class="fa-solid fa-film"></i></div>
        <p class="font-bold text-sm">Reward Video</p>
        <p class="text-xs text-emerald-400">+150 XOIZ</p>
        <button onclick="watchAd()" class="w-full neon-btn py-1.5 rounded-lg text-xs font-bold text-black mt-2">WATCH</button>
      </div>
      <div class="neon-card p-4 rounded-xl text-center space-y-2">
        <div class="text-2xl text-emerald-400"><i class="fa-solid fa-gamepad"></i></div>
        <p class="font-bold text-sm">Play & Earn</p>
        <p class="text-xs text-emerald-400">+100 XOIZ</p>
        <button onclick="watchAd()" class="w-full neon-btn py-1.5 rounded-lg text-xs font-bold text-black mt-2">PLAY</button>
      </div>
    </div>
  </div>

  <!-- TAB: WALLET -->
  <div id="tab-wallet" class="tab-content hidden px-5 space-y-4">
    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Cash Out</p>
    <div class="neon-card rounded-xl p-4 space-y-3">
      <label class="text-xs font-semibold text-gray-300">Select Gateway</label>
      <div class="grid grid-cols-2 gap-2">
        <div class="bg-emerald-950 p-2.5 rounded-lg border border-emerald-700 text-xs font-bold text-emerald-300 text-center">FaucetPay</div>
        <div class="bg-emerald-950/40 p-2.5 rounded-lg border border-gray-800 text-xs font-bold text-gray-500 text-center">USDT (BEP20)</div>
      </div>
      
      <label class="text-xs font-semibold text-gray-300 mt-2 block">FaucetPay Email / Address</label>
      <input type="text" placeholder="name@example.com" class="w-full bg-black/50 border border-emerald-900 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
      
      <button onclick="requestWithdraw()" class="w-full neon-btn py-2.5 rounded-xl font-bold text-xs text-black mt-3">
        SUBMIT WITHDRAWAL
      </button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-0 right-0 bg-[#040e08]/95 backdrop-blur-md border-t border-emerald-950/80 px-6 py-3 flex justify-between items-center z-50">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-xs active-nav">
      <i class="fa-solid fa-house text-base"></i>
      <span class="mt-1 font-medium">Home</span>
    </button>
    <button onclick="switchTab('earn')" id="nav-earn" class="flex flex-col items-center text-xs text-gray-500">
      <i class="fa-solid fa-bolt text-base"></i>
      <span class="mt-1 font-medium">Earn</span>
    </button>
    <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center text-xs text-gray-500">
      <i class="fa-solid fa-wallet text-base"></i>
      <span class="mt-1 font-medium">Wallet</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Load User Data from Telegram
    const user = tg?.initDataUnsafe?.user;
    if (user) {
      document.getElementById('username').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
      document.getElementById('userId').innerText = user.id;
      document.getElementById('userAvatar').innerText = user.first_name.charAt(0).toUpperCase();
    }

    // Local Storage Balance Setup
    let currentBalance = parseInt(localStorage.getItem('xoiz_bal') || '0');
    function updateBalanceUI() {
      document.getElementById('balance').innerText = currentBalance;
      document.getElementById('usdVal').innerText = (currentBalance * 0.00002).toFixed(4);
      localStorage.setItem('xoiz_bal', currentBalance);
    }
    updateBalanceUI();

    // Tab Switching
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.active-nav').forEach(el => {
        el.classList.remove('active-nav');
        el.classList.add('text-gray-500');
      });
      document.getElementById('tab-' + tab).classList.remove('hidden');
      const activeBtn = document.getElementById('nav-' + tab);
      activeBtn.classList.remove('text-gray-500');
      activeBtn.classList.add('active-nav');
    }

    // Simulated Ad / Task Logic
    function watchAd() {
      if (tg) tg.HapticFeedback?.impactOccurred('medium');
      alert("Simulating Ad View... (Yahan Adsgram script trigger hoga)");
      currentBalance += 100;
      updateBalanceUI();
    }

    function openChannel() {
      if (tg) tg.openTelegramLink('https://t.me/xoizbot');
      currentBalance += 250;
      updateBalanceUI();
    }

    function requestWithdraw() {
      if (currentBalance < 500) {
        alert("Minimum withdrawal is 500 XOIZ!");
        return;
      }
      alert("Withdrawal request recorded!");
    }
  </script>
</body>
</html>
